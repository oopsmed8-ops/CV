<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>ملكة | ملف شخصي</title>
    <!-- استيراد خطوط عربية جميلة -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
    <!-- أيقونات FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary: #d4af37; /* ذهبي ملكي */
            --secondary: #0f0c29; /* كحلي داكن جداً */
            --accent: #e94560; /* وردي محمر */
            --text-light: #f5f5f5;
            --glass: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }

        /* تحسين التمرير على الهواتف */
        html, body {
            width: 100%;
            min-height: 100vh;
            overflow-x: hidden;
            background: #0f0c29;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: var(--text-light);
            display: flex;
            justify-content: center;
            align-items: flex-start; /* يسمح بالتمرير من الأعلى */
            padding: 20px 10px; /* هوامش آمنة للهواتف */
        }

        /* تأثيرات خلفية متحركة */
        .bg-shape {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            z-index: -1;
            pointer-events: none;
        }
        .shape1 { width: 300px; height: 300px; background: var(--primary); top: -50px; left: -50px; opacity: 0.25; animation: float 8s infinite ease-in-out; }
        .shape2 { width: 400px; height: 400px; background: var(--accent); bottom: -100px; right: -100px; opacity: 0.15; animation: float 10s infinite reverse ease-in-out; }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(20px, 20px) scale(1.1); }
            100% { transform: translate(0, 0) scale(1); }
        }

        .container {
            width: 100%;
            max-width: 800px;
            z-index: 1;
            display: flex;
            justify-content: center;
        }

        /* البطاقة الرئيسية */
        .card {
            background: rgba(26, 26, 46, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 30px 20px;
            width: 100%;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5), inset 0 0 0 1px rgba(255,255,255,0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            position: relative;
            overflow: hidden;
            animation: fadeIn 1s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, var(--primary), var(--accent), var(--primary));
            background-size: 200% 100%;
            animation: shimmer 3s infinite linear;
        }

        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* الصورة الشخصية */
        .avatar {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            background: linear-gradient(45deg, var(--primary), var(--accent));
            padding: 4px;
            margin-bottom: 15px;
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.3);
            position: relative;
            transition: transform 0.3s;
        }

        .avatar:hover {
            transform: scale(1.05);
        }

        .avatar img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--secondary);
        }

        /* تاج صغير فوق الصورة */
        .crown {
            position: absolute;
            top: -25px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 1.8rem;
            color: var(--primary);
            filter: drop-shadow(0 0 8px var(--primary));
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateX(-50%) translateY(0); }
            50% { transform: translateX(-50%) translateY(-6px); }
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.2rem;
            color: var(--primary);
            margin-bottom: 5px;
            letter-spacing: 1px;
            text-shadow: 0 2px 10px rgba(212, 175, 55, 0.2);
        }

        .username {
            font-size: 0.95rem;
            color: #aaa;
            margin-bottom: 15px;
            direction: ltr; 
            font-family: 'Cairo', sans-serif;
        }

        .bio {
            font-style: italic;
            font-size: 1rem;
            color: #ddd;
            margin-bottom: 25px;
            line-height: 1.7;
            padding: 0 15px;
            position: relative;
            max-width: 90%;
        }

        .bio::before, .bio::after {
            content: '"';
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            color: var(--primary);
            opacity: 0.4;
            position: absolute;
        }
        .bio::before { top: -15px; right: 0; }
        .bio::after { bottom: -25px; left: 0; }

        /* معلومات الجامعة */
        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            width: 100%;
            margin-bottom: 25px;
            direction: rtl;
        }

        .info-item {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 15px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: all 0.3s ease;
            cursor: default;
        }

        .info-item:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(212, 175, 55, 0.3);
            transform: translateY(-3px);
        }

        .info-item i {
            font-size: 1.4rem;
            color: var(--primary);
            margin-bottom: 8px;
        }

        .info-item span {
            font-size: 0.8rem;
            color: #aaa;
        }

        .info-item strong {
            font-size: 1rem;
            color: #fff;
            margin-top: 4px;
            font-weight: 600;
        }

        /* روابط التواصل */
        .social-links {
            display: flex;
            gap: 15px;
            margin-top: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .social-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.06);
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-light);
            font-size: 1.4rem;
            text-decoration: none;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .social-btn:hover {
            background: var(--primary);
            color: var(--secondary);
            transform: translateY(-5px) scale(1.1);
            box-shadow: 0 10px 20px rgba(212, 175, 55, 0.4);
            border-color: var(--primary);
        }

        /* تذييل الصفحة */
        .footer {
            margin-top: 25px;
            font-size: 0.75rem;
            color: #666;
            text-align: center;
            direction: rtl;
        }

        /* ====== تجاوب دقيق مع الشاشات ====== */
        @media (max-width: 600px) {
            body {
                padding: 15px 8px;
            }
            .card {
                padding: 25px 15px;
                border-radius: 20px;
            }
            h1 {
                font-size: 1.8rem;
            }
            .avatar {
                width: 110px;
                height: 110px;
            }
            .crown {
                font-size: 1.5rem;
                top: -20px;
            }
            .bio {
                font-size: 0.9rem;
                padding: 0 5px;
            }
            .info-grid {
                grid-template-columns: 1fr 1fr; /* يبقى عمودين لكن بحجم أصغر */
                gap: 8px;
            }
            .info-item {
                padding: 10px 5px;
            }
            .info-item i {
                font-size: 1.2rem;
            }
            .info-item strong {
                font-size: 0.9rem;
            }
            .social-btn {
                width: 45px;
                height: 45px;
                font-size: 1.2rem;
            }
        }

        /* للشاشات الصغيرة جداً (أقل من 380px) */
        @media (max-width: 380px) {
            .info-grid {
                grid-template-columns: 1fr; /* عمود واحد للشاشات الضيقة جداً */
            }
            h1 {
                font-size: 1.6rem;
            }
        }
    </style>
</head>
<body>

    <div class="bg-shape shape2"></div>

        </div>
    </div>

</body>
</html>
